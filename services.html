<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
  <meta charset="UTF-8">

        <!-- پلیر یا آی‌فریم ویدیو اینجا لود می‌شود -->
      </div>
    </div>
  </div>

  <script src="js/cart.js"></script>
