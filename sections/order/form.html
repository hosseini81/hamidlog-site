<section class="order-system-hub">

  <!-- پاپ‌آپ پیام‌های سیستم -->
  <div id="customAlert" class="custom-alert-overlay">
    <div class="custom-alert-card">
      <div id="customAlertIcon" class="custom-alert-icon">⚠️</div>
      <div id="customAlertTitle" class="custom-alert-title">پیام سیستم</div>
      <div id="customAlertText" class="custom-alert-text"></div>
      <button type="button" class="btn-main" onclick="closeCustomAlert()" style="width: 100%;">متوجه شدم</button>
    </div>
  </div>

  <!-- لودر اولیه دریافت داده‌ها از شیت -->
  <div id="dataLoader" class="loading-box">
    <span class="spinner"></span>
    در حال دریافت تعرفه‌ها و امکانات از سرور ابری...
  </div>

  <!-- کانتینر اصلی خدمات طراحی سایت -->
  <div class="order-main-grid" id="orderMainGrid" style="display:none;">

    <!-- ستون گام‌های پیکربندی پروژه -->
    <div class="order-config-col">
      <div class="steps-bar" id="stepsBar">
        <button type="button" class="step-btn active" onclick="goStep(1)">۱. انتخاب پکیج پایه</button>
        <button type="button" class="step-btn" onclick="goStep(2)">۲. ماژول‌ها و امکانات مازاد</button>
        <button type="button" class="step-btn" onclick="goStep(3)">۳. کسر اقلام موجود شما</button>
      </div>

      <!-- گام ۱: انتخاب پکیج پایه -->
      <div id="step1" class="step-content active">
        <div class="step-head-title">یکی از پکیج‌های پایه متناسب با کسب‌وکار خود را انتخاب فرمایید:</div>
        <div id="packagesGrid" class="package-grid"></div>
      </div>

      <!-- گام ۲: ماژول‌ها و امکانات جانبی -->
      <div id="step2" class="step-content">
        <div class="layout-switcher">
          <label class="step-head-title" style="margin-bottom:0;">امکانات فنی و ماژول‌های تکمیلی:</label>
          <div class="view-toggle-btns">
            <button type="button" class="view-btn active" id="extraListBtn" onclick="toggleLayout('extra', 'list')">لیست</button>
            <button type="button" class="view-btn" id="extraGridBtn" onclick="toggleLayout('extra', 'grid')">شبکه</button>
          </div>
        </div>
        <div class="category-filter-bar" id="extraCatFilters"></div>
        <div class="scrollable-service-list">
          <div id="extraItemsList" class="services-container list-view"></div>
        </div>
      </div>

      <!-- گام ۳: اقلام از قبل موجود جهت کسر -->
      <div id="step3" class="step-content">
        <div class="layout-switcher">
          <label class="step-head-title" style="margin-bottom:0;">اقلام از قبل موجود شما (کسر خودکار از مبلغ):</label>
          <div class="view-toggle-btns">
            <button type="button" class="view-btn active" id="deductListBtn" onclick="toggleLayout('deduct', 'list')">لیست</button>
            <button type="button" class="view-btn" id="deductGridBtn" onclick="toggleLayout('deduct', 'grid')">شبکه</button>
          </div>
        </div>
        <div class="category-filter-bar" id="deductCatFilters"></div>
        <div class="scrollable-service-list">
          <div id="deductItemsList" class="services-container list-view"></div>
        </div>
      </div>

      <!-- ناوبری گام‌ها -->
      <div class="footer-step-actions" id="footerActions">
        <button type="button" class="btn-step-prev" id="prevBtn" onclick="changeStep(-1)" style="visibility:hidden;">➔ مرحله قبل</button>
        <button type="button" class="btn-step-next" id="nextBtn" onclick="changeStep(1)">مرحله بعد ➔</button>
      </div>
    </div>

    <!-- ستون خلاصه برآورد پروژه و دکمه سبد خرید -->
    <div class="order-summary-col">
      <div class="invoice-sticky-box">
        <div class="invoice-head">
          <h4>خلاصه برآورد پروژه</h4>
          <span class="badge-status-green">محاسبه آنلاین</span>
        </div>

        <div class="summary-kpi-grid">
          <div class="kpi-card"><div class="kpi-t">تخفیف پکیج</div><div class="kpi-v" id="kpiDiscount">۰٪</div></div>
          <div class="kpi-card"><div class="kpi-t">کسر اقلام</div><div class="kpi-v" id="kpiDeducted">۰ ت</div></div>
          <div class="kpi-card"><div class="kpi-t">مدت زمان</div><div class="kpi-v" id="kpiDays">۰ روز</div></div>
        </div>

        <div class="total-highlight-box">
          <div class="tot-label">برآورد نهایی هزینه پروژه</div>
          <div class="tot-value" id="kpiTotal">۰ تومان</div>
        </div>

        <div class="order-items-scrollbox">
          <div class="items-title">📋 جزئیات گزینه‌های انتخابی:</div>
          <div id="orderItemsSummaryList"></div>
        </div>

        <button type="button" class="btn-main" onclick="proceedToCheckout()" style="width:100%; padding:14px; font-size:13px;">
          🛒 افزودن به سبد خرید و ادامه ➔
        </button>
      </div>
    </div>

  </div>

</section>
