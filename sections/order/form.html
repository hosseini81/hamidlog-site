<section class="order-layout">
  <!-- فرم انتخاب پکیج و امکانات -->
  <div class="order-controls">
    
    <div class="order-box">
      <h3>۱. نوع پروژه و قالب پایه</h3>
      <div class="plan-selector">
        <label class="plan-card active">
          <input type="radio" name="plan" value="shop" data-price="9500000" data-name="فروشگاه اینترنتی ووکامرس" checked onchange="calcTotal()">
          <div class="plan-details">
            <span class="plan-title">🛍️ فروشگاه اینترنتی (ووکامرس)</span>
            <span class="plan-desc">مناسب فروش کالا، درگاه شاپرک، انبارداری و پنل مشتریان</span>
            <span class="plan-cost">۹,۵۰۰,۰۰۰ تومان</span>
          </div>
        </label>

        <label class="plan-card">
          <input type="radio" name="plan" value="corp" data-price="6500000" data-name="سایت شرکتی و خدماتی" onchange="calcTotal()">
          <div class="plan-details">
            <span class="plan-title">🏢 وب‌سایت شرکتی / کاتالوگ</span>
            <span class="plan-desc">معرفی خدمات، لندینگ‌های اختصاصی و فرم استعلام سریع</span>
            <span class="plan-cost">۶,۵۰۰,۰۰۰ تومان</span>
          </div>
        </label>
      </div>
    </div>

    <div class="order-box">
      <h3>۲. سرویس‌ها و ماژول‌های تکمیلی</h3>
      <div class="addons-list">
        <label class="addon-item">
          <input type="checkbox" class="feature-opt" value="درگاه پرداخت زرین‌پال / شاپرک" data-price="750000" onchange="calcTotal()">
          <div class="addon-info">
            <span>درگاه مستقیم بانکی شاپرک و زرین‌پال (پیکربندی + تست شبیه‌ساز)</span>
            <strong>۷۵۰,۰۰۰ ت</strong>
          </div>
        </label>

        <label class="addon-item">
          <input type="checkbox" class="feature-opt" value="پنل پیامکی ورود با کد یکبارمصرف (OTP)" data-price="900000" onchange="calcTotal()">
          <div class="addon-info">
            <span>سیستم پیامک اطلاع‌رسانی و ورود با کد یکبارمصرف OTP</span>
            <strong>۹۰۰,۰۰۰ ت</strong>
          </div>
        </label>

        <label class="addon-item">
          <input type="checkbox" class="feature-opt" value="اتصال اتوماتیک به دیتابیس شیت‌های ابری" data-price="1200000" onchange="calcTotal()">
          <div class="addon-info">
            <span>همگام‌سازی سفارش‌ها و موجودی با Google Sheets</span>
            <strong>۱,۲۰۰,۰۰۰ ت</strong>
          </div>
        </label>

        <label class="addon-item">
          <input type="checkbox" class="feature-opt" value="بهینه‌سازی سرعت و کش عمیق سرور" data-price="850000" onchange="calcTotal()">
          <div class="addon-info">
            <span>ارتقای رتبه سرعت لود زیر ۲ ثانیه و تنظیم کش حرفه‌ای</span>
            <strong>۸۵۰,۰۰۰ ت</strong>
          </div>
        </label>
      </div>
    </div>

  </div>

  <!-- ستون کناری: فاکتور زنده و ثبت نهایی -->
  <div class="order-invoice-col">
    <div class="invoice-card">
      <div class="invoice-head">
        <h4>پیش‌فاکتور آنلاین و برآورد</h4>
        <span class="order-code" id="orderIdText">#ORD----</span>
      </div>

      <div class="invoice-summary">
        <div class="summary-row">
          <span id="sumPlanName">فروشگاه اینترنتی</span>
          <span id="sumPlanPrice">۹,۵۰۰,۰۰۰</span>
        </div>
        <div id="selectedFeaturesList" class="features-summary-wrap"></div>
        <div class="summary-divider"></div>
        <div class="summary-total">
          <span>مبلغ قابل پرداخت:</span>
          <strong id="sumTotalPrice">۹,۵۰۰,۰۰۰ تومان</strong>
        </div>
      </div>

      <form id="leadForm" onsubmit="submitOrder(event)">
        <div class="form-group">
          <input type="text" id="custName" placeholder="نام و نام خانوادگی" required>
        </div>
        <div class="form-group">
          <input type="tel" id="custPhone" placeholder="شماره موبایل (جهت هماهنگی)" dir="ltr" pattern="09[0-9]{9}" required>
        </div>
        <button type="submit" id="submitBtn" class="btn-submit-order">
          ثبت نهایی و دریافت مشاوره ➔
        </button>
      </form>

      <div id="statusMessage" class="status-msg"></div>
    </div>
  </div>
</section>
