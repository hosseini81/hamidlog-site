<section class="order-system-hub">

  <!-- پاپ‌آپ سراسری پیام‌ها -->
  <div id="customAlert" class="custom-alert-overlay">
    <div class="custom-alert-card">
      <div id="customAlertIcon" class="custom-alert-icon">⚠️</div>
      <div id="customAlertTitle" class="custom-alert-title">پیام سیستم</div>
      <div id="customAlertText" class="custom-alert-text"></div>
      <button type="button" class="btn-main" onclick="closeCustomAlert()" style="width: 100%;">متوجه شدم</button>
    </div>
  </div>

  <!-- نوار بالای سامانه: دکمه‌های ۳ تب -->
  <div class="hub-top-nav">
    <div class="hub-nav-tabs">
      <button type="button" class="hub-tab-btn active" id="btn-tabOrder" onclick="switchNavTab('tabOrder')">🚀 استعلام خدمات و محاسبه فاکتور</button>
      <button type="button" class="hub-tab-btn" id="btn-tabProduct" onclick="switchNavTab('tabProduct')">🛍️ محصولات دانلودی</button>
      <button type="button" class="hub-tab-btn" id="btn-tabUserPanel" onclick="switchNavTab('tabUserPanel')">👤 حساب کاربری و اقساط</button>
    </div>
    <div id="headerUserProfile" class="user-mini-badge" onclick="switchNavTab('tabUserPanel')">
      <img id="headerUserAvatar" src="https://via.placeholder.com/26?text=U" alt="پروفایل" />
      <span id="headerUserName">ورود / ثبت‌نام</span>
    </div>
  </div>

  <!-- فراخوانی ۳ تب مجزا -->
  <div data-include="sections/order/tab-services.html"></div>
  <div data-include="sections/order/tab-products.html"></div>
  <div data-include="sections/order/tab-user.html"></div>

</section>
