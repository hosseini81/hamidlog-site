<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبد خرید من | استودیو حمیدرضا</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css">
  <style>
    .cart-page-wrap {
      max-width: 800px;
      margin: 10px auto;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.03);
    }
    .cart-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 14px;
    }
    .cart-table th, .cart-table td {
      padding: 12px 10px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 12px;
      text-align: right;
    }
    .cart-table th {
      background: #f8fafc;
      color: var(--text-muted);
      font-weight: 800;
    }
    .btn-remove-item {
      background: #fee2e2;
      color: #dc2626;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 13px;
    }
    .cart-checkout-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 2px dashed var(--border-color);
    }
  </style>
</head>
<body>

  <!-- هدر -->
  <div id="header-slot"></div>

  <main>
    <div class="cart-page-wrap">
      <h2 style="font-size:16px; font-weight:900; color:var(--bg-dark); margin-bottom:6px;">🛒 سبد خرید شما</h2>
      <p style="font-size:11px; color:var(--text-muted);">اقلام انتخابی خود را بررسی نموده و جهت نهایی‌سازی سفارش روی دکمه تسویه حساب کلیک فرمایید.</p>

      <div id="cartItemsContainer">
        <!-- جدول یا پیام سبد خالی در اینجا رندر می‌شود -->
      </div>
    </div>
  </main>

  <!-- فوتر -->
  <div id="footer-slot"></div>

  <!-- اسکریپت‌ها -->
  <script src="js/cart.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/ui.js"></script>
  <script>
    function renderCartPage() {
      const container = document.getElementById('cartItemsContainer');
      const cart = getCart();

      if (cart.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding:50px 20px;">
            <div style="font-size:44px; margin-bottom:12px;">🛒</div>
            <h3 style="font-size:15px; color:#475569;">سبد خرید شما در حال حاضر خالی است</h3>
            <p style="font-size:11px; color:#94a3b8; margin:8px 0 18px;">می‌توانید خدمات طراحی سایت یا محصولات دانلودی ما را بررسی کنید.</p>
            <a href="services.html" class="btn-main" style="margin-left:8px;">مشاهده خدمات</a>
            <a href="shop.html" class="btn-outline" style="color:#0f172a; border-color:#cbd5e1;">فروشگاه محصولات</a>
          </div>
        `;
        return;
      }

      let totalSum = 0;
      let rows = '';

      cart.forEach((item, idx) => {
        totalSum += item.price;
        rows += `
          <tr>
            <td>
              <strong>${item.title}</strong>
              <div style="font-size:10px; color:#64748b;">${item.type === 'service' ? 'پروژه سفارشی وب' : `نسخه دانلودی ${item.version}`}</div>
            </td>
            <td style="font-weight:800; color:#059669;">${Number(item.price).toLocaleString('fa-IR')} تومان</td>
            <td style="text-align:center;">
              <button type="button" class="btn-remove-item" onclick="removeFromCart(${idx})" title="حذف">✕</button>
            </td>
          </tr>
        `;
      });

      container.innerHTML = `
        <table class="cart-table">
          <thead>
            <tr>
              <th>شرح کالا یا خدمات</th>
              <th>مبلغ</th>
              <th style="text-align:center;">حذف</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>

        <div class="cart-checkout-bar">
          <div>
            <div style="font-size:10px; color:#64748b;">جمع کل فاکتور:</div>
            <div style="font-size:18px; font-weight:900; color:#059669;">${totalSum.toLocaleString('fa-IR')} تومان</div>
          </div>
          <button type="button" class="btn-main" onclick="goToCheckoutPage()" style="padding:12px 24px; font-size:13px;">
            تکمیل سفارش و پرداخت ➔
          </button>
        </div>
      `;
    }

    function goToCheckoutPage() {
      const cart = getCart();
      if (cart.length === 0) return;

      // تجمیع اقلام سبد برای ارسال به صفحه پرداخت
      let total = 0;
      let titles = [];
      cart.forEach(item => {
        total += item.price;
        titles.push(item.title);
      });

      const pendingOrder = {
        packageName: titles.join(' + '),
        finalPriceNumeric: total,
        pkgBaseSum: total,
        addedServicesSummary: cart.map(i => `${i.title} (${Number(i.price).toLocaleString('fa-IR')} ت)`),
        deductedServicesSummary: []
      };

      sessionStorage.setItem("pending_order_data", JSON.stringify(pendingOrder));
      window.location.href = "checkout.html";
    }

    document.addEventListener("DOMContentLoaded", renderCartPage);
  </script>
</body>
</html>
